server:
  port: 2121

spring:
  application:
    name: DdinovsTravel
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:DdinovsTravel}
    username: postgres
    password: bm040321
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  jwt:
    # Override in production. Must be at least 32 characters (HS256).
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key}
    access-token-expiration: 3600000        # 1 hour
    refresh-token-expiration: 2592000000    # 30 days
  upload:
    dir: ${UPLOAD_DIR:uploads}
    public-url: ${UPLOAD_PUBLIC_URL:/api/media/files}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@ddinovstravel.uz}
    password: ${ADMIN_PASSWORD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: info
