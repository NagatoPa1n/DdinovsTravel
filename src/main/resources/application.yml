server:
  # 2121 is published by the telegram-app Docker container on this machine, so the
  # app could not bind it. Override with SERVER_PORT if 8080 is taken instead.
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: DdinovsTravel
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:DdinovsTravel}
    username: ${DB_USER:postgres}
    # Set DB_PASSWORD in the environment. Never commit the real value: this file is
    # tracked in a public repository.
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        schema_update:
          unique_constraint_strategy: skip
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  jwt:
    # Override in production. Must be at least 32 characters (HS256).
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key}
    access-token-expiration: 3600000        # 1 hour
    refresh-token-expiration: 2592000000    # 30 days
  upload:
    dir: ${UPLOAD_DIR:uploads}
    public-url: ${UPLOAD_PUBLIC_URL:/api/media/files}
  cors:
    # The live site plus the local dev servers. Both the apex and www are listed: a browser
    # sends whichever the visitor typed, and an unlisted one is refused with a 403.
    allowed-origins: ${CORS_ORIGINS:https://ddinovstravel.uz,https://www.ddinovstravel.uz,http://localhost:3000,http://localhost:5173,http://localhost:4173}
  telegram:
    # Contact-form enquiries are delivered to this chat via the Bot API.
    # Token from @BotFather; chat-id is a numeric user/group id or @channelname.
    # Set both in the environment. With either missing, enquiries are logged and skipped
    # rather than delivered -- the site keeps working.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    timeout-ms: 6000
  translation:
    # Machine translation of stored content (tours, destinations, categories, pages)
    # via the Google Cloud Translation API. Disable with TRANSLATION_ENABLED=false; the site then
    # simply serves the text as authored.
    enabled: ${TRANSLATION_ENABLED:true}
    # Set TRANSLATION_API_KEY in the environment. With no key the service simply stays
    # inactive and the site serves content as authored.
    api-key: ${TRANSLATION_API_KEY:}
    # Language the content is written in. Requests for this language skip translation.
    source-language: ${TRANSLATION_SOURCE_LANG:uz}
    target-languages: en,ru,uz
    # Results are cached in the translation_cache table, so each distinct string is
    # only ever paid for once per language.
    batch-size: 64
    max-chars-per-text: 12000
    timeout-ms: 6000
  admin:
    email: ${ADMIN_EMAIL:admin@ddinovstravel.uz}
    password: ${ADMIN_PASSWORD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: info
